<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="author" content="Blessing Fortune Kwomo" />
  <meta name="description" content="Photo Gallery" />
  <meta name="keywords" content="photo, gallery, collections" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Picture Gallery</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="container">
    <h1>Photo Gallery</h1>
    <h2>Enter the number of photos</h2>

    <input
      type="number"
      id="input"
      class="input"
      value="2"
      min="1"
      max="20"
    />

    <small class="errorMessage" id="errorMessage"></small>

    <button class="btn" id="btn">Get Pictures</button>

    <div class="gallery" id="gallery"></div>
  </div>

  <!-- cache-buster so GitHub Pages loads your latest JS -->
  <script src="index.js?v=3"></script>
</body>
</html>
